name: Build Deploy and Verify (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: "ap-south-1"
  ECR_REPOSITORY: "to-do-next-type"
  ECR_REGISTRY: "759204735992.dkr.ecr.ap-south-1.amazonaws.com"
  INSTANCE_ID: "i-0a7c50e356283e5fb"
  PUBLIC_URL: "http://3.108.70.64"
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Build diagnostics
        if: failure()
        run: |
          echo "=== Build failed: dumping diagnostics ==="
          node -v
          npm -v
          ls -la
          df -h || true
          npm cache verify || true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region "ap-south-1"

      - name: Login to ECR
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws ecr get-login-password --region "ap-south-1" \
            | docker login --username AWS --password-stdin "759204735992.dkr.ecr.ap-south-1.amazonaws.com"

      - name: Build and push image
        run: |
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="to-do-next-type"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "Building image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region "ap-south-1"

      - name: Deploy to EC2 via SSM
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          REGION="ap-south-1"
          INSTANCE_ID="i-0a7c50e356283e5fb"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="to-do-next-type"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "export AWS_ACCESS_KEY_ID=\$(cat /etc/aws-creds/aws_access_key_id 2>/dev/null || echo '')",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:3000 --name app $IMAGE_URI",
              "docker ps | grep app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for SSM command to finish..."
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" \
              --output text)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              break
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi
            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed"
            exit 1
          fi

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://3.108.70.64" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: did not receive HTTP 200 from http://3.108.70.64"
          exit 1