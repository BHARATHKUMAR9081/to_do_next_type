name: Build and Deploy to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: to-do-next-type
  INSTANCE_ID: i-013004e5967e034fc
  PUBLIC_URL: http://13.234.180.139

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint || true

      - name: Build (diagnostics)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          echo "BUILD_EXIT=$?" >> $GITHUB_ENV
          ls -la .next || true

      - name: Configure AWS credentials (static)
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:latest" -t "$FULL_IMAGE:${{ github.sha }}" .
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${{ github.sha }}"
          echo "IMAGE_URI=$FULL_IMAGE:${{ github.sha }}" >> $GITHUB_ENV

      - name: Fetch runtime secrets from Secrets Manager
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          aws secretsmanager get-secret-value \
            --secret-id "deptic/to_do_next_type/secrets" \
            --region "$AWS_REGION" \
            --query SecretString --output text > /tmp/runtime-secrets.json
          echo "Secrets fetched successfully"

      - name: Deploy to EC2 via SSM
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          REGION="$AWS_REGION"
          ECR_REGISTRY_VAL="$ECR_REGISTRY"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          INSTANCE_ID_VAL="$INSTANCE_ID"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:3000 --name app $IMAGE_URI",
              "docker ps | grep app"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID_VAL" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --instance-id "$INSTANCE_ID_VAL" \
            --command-id "$COMMAND_ID" \
            --region "$AWS_REGION" || true

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deployment healthy: $PUBLIC_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1