name: Build Deploy and Verify (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: to-do-next-type
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-0a7c50e356283e5fb
  PUBLIC_URL: http://3.108.70.64
  SECRETS_ID: deptic/to_do_next_type/secrets
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Build diagnostics
        if: failure()
        run: |
          echo "=== Build failed: dumping diagnostics ==="
          echo "--- node version ---"
          node -v
          echo "--- npm version ---"
          npm -v
          echo "--- files at root ---"
          ls -la
          echo "--- disk usage ---"
          df -h || true
          echo "--- npm cache verify ---"
          npm cache verify || true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region ap-south-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 \
            | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build and push image
        run: |
          IMAGE_URI="759204735992.dkr.ecr.ap-south-1.amazonaws.com/to-do-next-type:${GITHUB_SHA::12}"
          echo "Building image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" .
          docker tag "$IMAGE_URI" 759204735992.dkr.ecr.ap-south-1.amazonaws.com/to-do-next-type:latest
          docker push "$IMAGE_URI"
          docker push 759204735992.dkr.ecr.ap-south-1.amazonaws.com/to-do-next-type:latest
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region ap-south-1

      - name: Deploy to EC2 via SSM
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          REGION="ap-south-1"
          INSTANCE_ID="i-0a7c50e356283e5fb"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          IMAGE_URI="$ECR_REGISTRY/to-do-next-type:${GITHUB_SHA::12}"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/to-do-next-type:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:8000 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/to-do-next-type:latest",
              "docker ps --no-trunc"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy to-do-next-type" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM command id: $COMMAND_ID"
          aws ssm wait command-executed --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$REGION"
          STATUS=$(aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" \
            --region "$REGION" --query "Status" --output text)
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" \
              --region "$REGION" --output json || true
            echo "Deployment command failed with status: $STATUS"
            exit 1
          fi
          echo "Deployment command succeeded."

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check (HTTP 200 required)
        run: |
          set -e
          URL="http://3.108.70.64"
          echo "Checking health at $URL"
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/body.html -w "%{http_code}" -m 10 "$URL" || echo "000")
            echo "Attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check PASSED (HTTP 200)."
              head -c 500 /tmp/body.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check FAILED: did not receive HTTP 200 from $URL"
          exit 1